name: .NET Core CI/CD to AWS

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - "8000:8000"
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4
    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restaurar dependencias
      run: dotnet restore Servicios_Estudiantes.sln
    - name: Compilar la solucion
      run: dotnet build Servicios_Estudiantes.sln --no-restore --configuration Release
    - name: Ejecutar pruebas unitarias
      env:
        AWS_ACCESS_KEY_ID: "DUMMYIDEXAMPLE"
        AWS_SECRET_ACCESS_KEY: "DUMMYEXAMPLEKEY"
        AWS_REGION: "us-east-1"
        GITHUB_ACTIONS: "true"
        OTEL_EXPORTER_OTLP_ENDPOINT_LOGS: "http://localhost:4317"
        OTEL_EXPORTER_OTLP_ENDPOINT_TRACES: "http://localhost:4317"
        OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer_Dummy"
        NOMBRE_SERVICIO: "Servicios_Estudiantes_Test"
        ORIGENES_CORS_PERMITIDOS: "http://localhost:4200"
        AWS__DynamoDB__ServiceURL: "http://localhost:8000"
      run: dotnet test Servicios_Estudiantes.sln --no-build --configuration Release --verbosity normal

  deploy-to-ecr:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4
    - name: Configurar Credenciales AWS via OIDC (Seguro)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}
        audience: sts.amazonaws.com
    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Construir y Subir imagen Docker a ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_URI: ${{ secrets.AWS_ECR_REPOSITORY_URI }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Extraer nombre del repositorio de la URI completa
        REPO_NAME=$(echo $ECR_REPOSITORY_URI | cut -d'/' -f2)
        docker build -t $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG -t $ECR_REGISTRY/$REPO_NAME:latest .
        docker push $ECR_REGISTRY/$REPO_NAME:$IMAGE_TAG
        docker push $ECR_REGISTRY/$REPO_NAME:latest